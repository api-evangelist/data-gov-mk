aid: data-gov-mk
name: data.gov.mk
description: >-
  data.gov.mk is the national government open-data portal for North Macedonia, operated by the Ministry
  of Digital Transformation. It runs CKAN and exposes the standard CKAN Action API over roughly 280+
  datasets from 50+ public institutions, supporting programmatic dataset search, metadata retrieval, and
  resource access, plus DCAT exports (N3, TTL, XML, JSON-LD).
