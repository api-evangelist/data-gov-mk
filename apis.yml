apis:
  - aid: data-gov-mk:catalog
    name: data.gov.mk CKAN Action API
    description: >-
      CKAN Action API for data.gov.mk, a consistent JSON-over-HTTP interface over the national catalog.
      Standard actions include package_search, package_show, package_list, organization_list, group_list,
      and tag_list. Base URL https://data.gov.mk/api/3/action/. DCAT exports available in N3, TTL, XML,
      and JSON-LD.
